name: vuln-triage
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: make demo
      - uses: actions/upload-artifact@v4
        with: { name: triage-demo, path: out/ }

  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt semgrep
      - name: Installer Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567  # v0.3.1, épinglé par SHA
      - run: bash scripts/run_scanners.sh
      - uses: actions/upload-artifact@v4
        with: { name: triage-real, path: out-real/ }
